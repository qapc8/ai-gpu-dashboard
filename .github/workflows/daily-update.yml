name: Data Update (Daily)

# The full pipeline runs every day.
#
# It used to be split: a daily job running update_daily.py, and the real
# refresh only on Mondays. update_daily.py fetches Vast.ai, RunPod, stocks and
# news -- so AWS, GCP, Azure, Lambda, CoreWeave and Together prices, the
# inference market, prediction markets, model sizing and the price history all
# sat untouched six days a week while the page said "Data updated" with a
# timestamp from that morning. Everything that can be refreshed daily now is.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A run can take ~15 minutes. Overlapping runs would race on the same commit,
# so a new one waits rather than being cancelled -- cancelling would drop a
# day's price observation out of the history.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Enough history for price_history to backfill any days a failed run
          # missed. The accumulated series lives in data.json, so this is a
          # safety net rather than the primary source.
          fetch-depth: 60

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run full data update
        id: update
        # A failed fetcher must not discard the sources that did succeed (that
        # is how the 2026-07-27 weekly update got thrown away), so the step is
        # allowed to fail and the sanity check below decides what publishes.
        continue-on-error: true
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Without these the AI commentary is not regenerated; the updater
          # prints a ::warning:: and the page flags the text as out of date.
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # Optional market-intelligence keys. Each source is skipped cleanly
          # (and says so on the page) when its key is absent.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -u scripts/update_data.py

      - name: Sanity-check before publishing
        # Hard errors (missing sections, too few prices, implausible values)
        # stop the publish. Previously this step and the commit both ran with
        # `if: always()`, so a failed check still pushed the file it rejected.
        run: python -u scripts/sanity_check.py data.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json ai_analysis.json
          if ! git diff --quiet --cached; then
            git commit -m "chore: daily data refresh [automated]"
            # A concurrent push (a manual run, or a human commit) would reject
            # this one and silently lose the day's observation.
            for i in 1 2 3; do
              git push && break
              echo "push rejected, rebasing onto origin/master"
              git pull --rebase --strategy-option=ours origin master || exit 1
            done
          else
            echo "No changes to commit."
          fi
