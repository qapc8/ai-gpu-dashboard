name: Data Update (Daily)

# The full pipeline runs every day.
#
# It used to be split: a daily job running update_daily.py, and the real
# refresh only on Mondays. update_daily.py fetches Vast.ai, RunPod, stocks and
# news -- so AWS, GCP, Azure, Lambda, CoreWeave and Together prices, the
# inference market, prediction markets, model sizing and the price history all
# sat untouched six days a week while the page said "Data updated" with a
# timestamp from that morning. Everything that can be refreshed daily now is.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A run can take ~15 minutes. Overlapping runs would race on the same commit,
# so a new one waits rather than being cancelled -- cancelling would drop a
# day's price observation out of the history.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Enough history for price_history to backfill any days a failed run
          # missed. The accumulated series lives in data.json, so this is a
          # safety net rather than the primary source.
          fetch-depth: 60

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run full data update
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # config.py is gitignored, so without these the AI sections silently
          # kept whatever they last said. Absent secrets are still handled:
          # update_ai_analysis logs it and leaves ai_analysis.json alone.
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -u scripts/update_data.py

      - name: Copy to embedded files
        # Run even when a fetcher failed: the updater still writes every source
        # that did succeed, and discarding the whole refresh over one dead
        # scraper is how the 2026-07-27 weekly update got thrown away.
        if: always()
        run: |
          cp data.json embedded_data.json
          cp ai_analysis.json embedded_ai.json

      - name: Check the file is servable
        # A truncated or half-written data.json takes the whole dashboard down,
        # since every tab reads it. Better to fail here than to publish it.
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data.json"))
          missing = [k for k in ("providers", "matrix", "specs", "inference") if not d.get(k)]
          if missing:
              sys.exit(f"data.json is missing required sections: {missing}")
          pairs = sum(len(p.get("gpus") or {}) for p in d["providers"].values())
          if pairs < 20:
              sys.exit(f"only {pairs} provider/GPU prices -- refusing to publish")
          fresh = d.get("_meta", {}).get("freshness", {})
          stale = sorted(k for k, v in fresh.items() if v.get("auto") and v.get("stale_runs", 0) >= 3)
          print(f"OK: {pairs} provider/GPU prices, {len(d['matrix'])} GPUs")
          if stale:
              print(f"::warning::sections stale for 3+ runs: {', '.join(stale)}")
          PY

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json ai_analysis.json embedded_data.json embedded_ai.json
          if ! git diff --quiet --cached; then
            git commit -m "chore: daily data refresh [automated]"
            # A concurrent push (a manual run, or a human commit) would reject
            # this one and silently lose the day's observation.
            for i in 1 2 3; do
              git push && break
              echo "push rejected, rebasing onto origin/master"
              git pull --rebase --strategy-option=ours origin master || exit 1
            done
          else
            echo "No changes to commit."
          fi
